<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CathFlow 系統入口網站" />
  <title>CathFlow 系統入口</title>

  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --secondary: #2563eb;
      --secondary-dark: #1d4ed8;
      --text-main: #153047;
      --text-light: #60758a;
      --card-bg: rgba(255, 255, 255, 0.92);
      --border: rgba(148, 163, 184, 0.25);
      --shadow: 0 20px 45px rgba(15, 47, 68, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        "Microsoft JhengHei",
        "Noto Sans TC",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(45, 212, 191, 0.25), transparent 35%),
        radial-gradient(circle at bottom right, rgba(96, 165, 250, 0.25), transparent 35%),
        linear-gradient(135deg, #eefbf9 0%, #f5f9ff 48%, #edf5ff 100%);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .background-shape {
      position: fixed;
      border-radius: 999px;
      filter: blur(4px);
      opacity: 0.25;
      pointer-events: none;
    }

    .shape-one {
      width: 260px;
      height: 260px;
      top: -90px;
      right: -70px;
      background: #5eead4;
    }

    .shape-two {
      width: 220px;
      height: 220px;
      bottom: -80px;
      left: -60px;
      background: #93c5fd;
    }

    header {
      width: 100%;
      padding: 26px 7vw;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 0.04em;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: white;
      background: linear-gradient(135deg, var(--primary), #14b8a6);
      box-shadow: 0 10px 25px rgba(15, 118, 110, 0.25);
    }

    .brand-icon svg {
      width: 25px;
      height: 25px;
    }

    .header-label {
      color: var(--text-light);
      font-size: 0.92rem;
    }

    main {
      width: min(1080px, 88vw);
      margin: auto;
      padding: 44px 0 80px;
      position: relative;
      z-index: 1;
    }

    .hero {
      text-align: center;
      margin-bottom: 48px;
    }

    .eyebrow {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      color: var(--primary);
      background: rgba(20, 184, 166, 0.11);
      border: 1px solid rgba(20, 184, 166, 0.18);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.04em;
    }

    .hero-highlight {
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 680px;
      margin: 22px auto 0;
      color: var(--text-light);
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.8;
    }

    .portal-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 26px;
    }

    .portal-card {
      position: relative;
      min-height: 310px;
      padding: 34px;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease;
    }

    .portal-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 28px 60px rgba(15, 47, 68, 0.18);
    }

    .portal-card.front:hover {
      border-color: rgba(15, 118, 110, 0.35);
    }

    .portal-card.admin:hover {
      border-color: rgba(37, 99, 235, 0.35);
    }

    .card-decoration {
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -65px;
      top: -65px;
      opacity: 0.12;
    }

    .front .card-decoration {
      background: var(--primary);
    }

    .admin .card-decoration {
      background: var(--secondary);
    }

    .portal-icon {
      width: 68px;
      height: 68px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      color: white;
      margin-bottom: 28px;
      position: relative;
      z-index: 1;
    }

    .front .portal-icon {
      background: linear-gradient(135deg, var(--primary), #2dd4bf);
      box-shadow: 0 12px 25px rgba(15, 118, 110, 0.25);
    }

    .admin .portal-icon {
      background: linear-gradient(135deg, var(--secondary), #60a5fa);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
    }

    .portal-icon svg {
      width: 34px;
      height: 34px;
    }

    .portal-card h2 {
      margin: 0;
      font-size: 1.65rem;
    }

    .portal-card p {
      margin: 14px 0 28px;
      color: var(--text-light);
      line-height: 1.75;
      flex-grow: 1;
    }

    .portal-link {
      width: 100%;
      min-height: 52px;
      padding: 14px 20px;
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: white;
      font-weight: 800;
      transition:
        transform 0.2s ease,
        filter 0.2s ease;
    }

    .portal-link:hover {
      transform: translateY(-2px);
      filter: brightness(1.06);
    }

    .portal-link svg {
      width: 19px;
      height: 19px;
      transition: transform 0.2s ease;
    }

    .portal-link:hover svg {
      transform: translateX(4px);
    }

    .front .portal-link {
      background: linear-gradient(135deg, var(--primary), #14b8a6);
    }

    .admin .portal-link {
      background: linear-gradient(135deg, var(--secondary), #3b82f6);
    }

    footer {
      text-align: center;
      padding: 22px;
      color: var(--text-light);
      font-size: 0.86rem;
      position: relative;
      z-index: 1;
    }


    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .about-button {
      border: 1px solid rgba(15, 118, 110, 0.22);
      background: rgba(255, 255, 255, 0.82);
      color: var(--primary-dark);
      min-height: 42px;
      padding: 10px 16px;
      border-radius: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(15, 47, 68, 0.08);
      backdrop-filter: blur(10px);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
    }

    .about-button:hover {
      transform: translateY(-2px);
      background: #fff;
      box-shadow: 0 12px 28px rgba(15, 47, 68, 0.13);
    }

    .about-button svg {
      width: 18px;
      height: 18px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(15, 23, 42, 0.42);
      backdrop-filter: blur(5px);
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .about-modal {
      width: min(680px, 94vw);
      border-radius: 18px;
      overflow: hidden;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.32);
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(10px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .about-modal-header {
      min-height: 54px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-bottom: 1px solid #dbe3ea;
    }

    .about-modal-header h3 { margin: 0; font-size: 1.05rem; font-weight: 700; }

    .modal-close {
      width: 36px; height: 36px; border: 0; border-radius: 8px;
      background: transparent; color: #475569; display: grid; place-items: center;
      cursor: pointer; font-size: 1.55rem; line-height: 1;
    }
    .modal-close:hover { background: #eef2f7; color: #0f172a; }

    .about-modal-body { padding: 0; text-align: left; }

    .about-hero {
      padding: 38px 42px 30px;
      text-align: center;
      background:
        radial-gradient(circle at 20% 25%, rgba(20,184,166,.14), transparent 34%),
        radial-gradient(circle at 80% 20%, rgba(59,130,246,.13), transparent 35%),
        linear-gradient(135deg, #f7fffe, #eef6ff);
      border-bottom: 1px solid #cbd5e1;
    }
    .about-brand-row { display:flex; justify-content:center; align-items:center; gap:18px; }
    .about-logo {
      width: 82px; height: 82px; border-radius: 24px; display:grid; place-items:center;
      color:#fff; background:linear-gradient(135deg,var(--primary),var(--secondary));
      box-shadow:0 14px 30px rgba(15,118,110,.22); flex:0 0 auto;
    }
    .about-logo svg { width:48px; height:48px; }
    .about-product-name {
      margin:0; font-size:clamp(2.6rem,8vw,4.8rem); line-height:1; letter-spacing:-.05em;
      font-style:italic; background:linear-gradient(90deg,var(--primary),var(--secondary));
      -webkit-background-clip:text; background-clip:text; color:transparent;
      text-shadow:0 3px 8px rgba(15,47,68,.08);
    }
    .about-subtitle { margin-top:18px; color:#25384a; font-size:1.22rem; font-weight:800; }

    .about-info { padding: 24px 34px 12px; color:#334155; font-size:1rem; line-height:1.7; }
    .about-info-row { display:grid; grid-template-columns:90px 16px 1fr; gap:4px; align-items:start; }
    .about-info-row + .about-info-row { margin-top:8px; }
    .about-info-label { color:#0f172a; font-weight:700; }
    .about-info-colon { color:#64748b; }
    .about-license {
      margin: 10px 34px 0; padding: 18px 0 4px; border-top:1px solid #cbd5e1;
      font-size:1.05rem; color:#0f172a;
    }
    .about-license strong { color:var(--primary-dark); }
    .about-copyright { margin:12px 34px 0; color:#94a3b8; font-size:.78rem; }

    .about-modal-footer { padding: 18px 34px 26px; display:flex; justify-content:flex-end; }
    .modal-confirm {
      min-width:150px; min-height:44px; padding:10px 28px; border:1px solid #94a3b8;
      border-radius:8px; color:#0f172a; background:#fff; font:inherit; font-weight:700; cursor:pointer;
    }
    .modal-confirm:hover { background:#f1f5f9; }


    @media (max-width: 760px) {
      header {
        padding: 20px 6vw;
      }

      .header-label {
        display: none;
      }

      main {
        width: min(92vw, 620px);
        padding-top: 25px;
      }

      .hero {
        margin-bottom: 34px;
      }

      .portal-grid {
        grid-template-columns: 1fr;
      }

      .portal-card {
        min-height: 285px;
        padding: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="background-shape shape-one"></div>
  <div class="background-shape shape-two"></div>

  <header>
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <span>CathFlow</span>
    </div>

    <div class="header-actions">
      <!-- <div class="header-label">心導管流程管理系統</div> -->
      <button class="about-button" id="aboutButton" type="button" aria-haspopup="dialog" aria-controls="aboutModal">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/>
          <path d="M12 10.5V16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="7.3" r="1.1" fill="currentColor"/>
        </svg>
        關於產品
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <!-- <div class="eyebrow">SYSTEM PORTAL</div> -->
      <h1>歡迎使用 <span class="hero-highlight">CathFlow</span></h1>
      <!-- <p>
        請依照您的使用需求，選擇進入前台作業網站或後台管理網站。
      </p> -->
    </section>

    <section class="portal-grid">
      <article class="portal-card front">
        <div class="card-decoration"></div>

        <div class="portal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9A2.5 2.5 0 0 1 18.5 17h-13A2.5 2.5 0 0 1 3 14.5v-9Z" stroke="currentColor" stroke-width="2"/>
            <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>

        <h2>前台作業網站</h2>
        <p>
          提供臨床作業使用功能。
        </p>

        <a
          id="frontendLink"
          class="portal-link"
          href="http://172.22.140.63:5020/"
          target="_blank"
          rel="noopener noreferrer"
        >
          進入前台
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </article>

      <article class="portal-card admin">
        <div class="card-decoration"></div>

        <div class="portal-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M12 3 4.5 6v5.4c0 4.4 3.2 8.5 7.5 9.6 4.3-1.1 7.5-5.2 7.5-9.6V6L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
            <path d="M9.5 12 11 13.5l3.5-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h2>後台管理網站</h2>
        <p>
          提供系統設定、資料維護管理功能。
        </p>

        <a
          id="backendLink"
          class="portal-link"
          href="http://172.22.140.63:5020/login"
          target="_blank"
          rel="noopener noreferrer"
        >
          進入後台
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </article>
    </section>
  </main>


  <div class="modal-backdrop" id="aboutModal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="about-modal">
      <div class="about-modal-header">
        <h3 id="aboutTitle">關於產品</h3>
        <button class="modal-close" id="aboutCloseButton" type="button" aria-label="關閉">×</button>
      </div>

      <div class="about-modal-body">
        <div class="about-hero">
          <div class="about-brand-row">
            <div class="about-logo" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 12h4l2-5 3 10 2-5h7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M12 21S4 16.2 4 9.7A4.7 4.7 0 0 1 12 6.3a4.7 4.7 0 0 1 8 3.4C20 16.2 12 21 12 21Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              </svg>
            </div>
            <h2 class="about-product-name">CathFlow</h2>
          </div>
          <div class="about-subtitle">心導管病患動態及資訊衛教軟體系統</div>
        </div>

        <div class="about-info">
          <div class="about-info-row"><div class="about-info-label">品名</div><div class="about-info-colon">：</div><div>心導管病患動態及資訊衛教軟體系統</div></div>
          <div class="about-info-row"><div class="about-info-label">型號</div><div class="about-info-colon">：</div><div>CathFlow</div></div>
          <div class="about-info-row"><div class="about-info-label">產品序號</div><div class="about-info-colon">：</div><div>SN26-001</div></div>
          <div class="about-info-row"><div class="about-info-label">Release</div><div class="about-info-colon">：</div><div>2026/8/11</div></div>
        </div>

        <div class="about-license">本產品已授權給：<strong>臺中榮民總醫院</strong></div>
        <!-- <p class="about-copyright">© <span id="aboutCurrentYear"></span> CathFlow. All rights reserved.</p> -->
      </div>

      <div class="about-modal-footer">
        <button class="modal-confirm" id="aboutConfirmButton" type="button">關閉</button>
      </div>
    </div>
  </div>

  <footer>
    © <span id="currentYear"></span> CathFlow. All rights reserved.
  </footer>

  <script>
    const cathFlowUrls = {
      //frontend: "https://net.vghtc.gov.tw/CathFlow/",
      frontend: "http://172.22.140.63:5020/",
      backend: "http://172.22.140.63:5020/login"
      //backend: "http://net.vghtc.gov.tw/cathFlow"
    };


    const aboutModal = document.getElementById("aboutModal");
    const aboutButton = document.getElementById("aboutButton");
    const aboutCloseButton = document.getElementById("aboutCloseButton");
    const aboutConfirmButton = document.getElementById("aboutConfirmButton");

    function openAboutModal() {
      aboutModal.classList.add("is-open");
      document.body.style.overflow = "hidden";
      aboutCloseButton.focus();
    }

    function closeAboutModal() {
      aboutModal.classList.remove("is-open");
      document.body.style.overflow = "";
      aboutButton.focus();
    }

    aboutButton.addEventListener("click", openAboutModal);
    aboutCloseButton.addEventListener("click", closeAboutModal);
    aboutConfirmButton.addEventListener("click", closeAboutModal);

    aboutModal.addEventListener("click", (event) => {
      if (event.target === aboutModal) {
        closeAboutModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && aboutModal.classList.contains("is-open")) {
        closeAboutModal();
      }
    });

    document.getElementById("frontendLink").href = cathFlowUrls.frontend;
    document.getElementById("backendLink").href = cathFlowUrls.backend;
    document.getElementById("currentYear").textContent = new Date().getFullYear();
    document.getElementById("aboutCurrentYear").textContent = new Date().getFullYear();
  </script>
</body>
</html>
